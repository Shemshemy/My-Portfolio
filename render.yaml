services:
  - type: web
    name: dennis-limo-portfolio
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORTFOLIO_ADMIN_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
